<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1512">
<title>德扑训练台</title>
<style>
  :root {
    --bg: #0f1512;
    --felt: #16342a;
    --felt-edge: #0c1f18;
    --surface: #182019;
    --surface-2: #1f2a22;
    --line: #2b3a30;
    --ink: #e8ece4;
    --muted: #97a394;
    --accent: #6fb394;
    --warn: #d2ac5c;
    --danger: #e0707a;
    --red: #e0707a;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
            "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .4; }

  .wrap { max-width: 860px; margin: 0 auto; padding: 12px 12px 140px; }

  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 4px 2px 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .02em; }
  header .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  .link-btn {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 4px; padding: 4px 10px; font-size: 12.5px;
  }
  .link-btn:hover { color: var(--ink); border-color: var(--accent); }

  /* ---------- 设置面板 ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 16px; margin-bottom: 16px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; color: var(--muted); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .field label {
    display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px;
    letter-spacing: .04em;
  }
  .field input, .field select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 4px; padding: 7px 9px; font-family: var(--mono); font-size: 13px;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seat-styles { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .seat-style { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .seat-style span { color: var(--muted); font-family: var(--mono); font-size: 12px; min-width: 48px; }
  .seat-style select { flex: 1; background: var(--surface-2); border: 1px solid var(--line);
                       border-radius: 4px; padding: 5px 7px; font-size: 12.5px; }

  .primary {
    background: var(--accent); color: #0b1410; border: none; border-radius: 5px;
    padding: 10px 18px; font-weight: 600; font-size: 14px;
  }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }

  /* ---------- 牌桌 ---------- */
  .felt {
    background: radial-gradient(ellipse at 50% 42%, var(--felt) 0%, var(--felt-edge) 100%);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 14px;
    margin-bottom: 14px;
  }
  .seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; }
  .seat {
    background: rgba(9, 16, 12, .55); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; position: relative; transition: border-color .15s, box-shadow .15s;
  }
  .seat.acting { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .seat.folded { opacity: .38; }
  .seat.hero { border-color: var(--warn); }
  .seat-top { display: flex; align-items: baseline; gap: 6px; }
  .seat-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat-pos { font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: .06em; }
  .seat-style-tag { font-size: 10.5px; color: var(--muted); margin-left: auto; }
  .seat-stack { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .seat-bet {
    font-family: var(--mono); font-size: 11.5px; color: var(--warn); margin-top: 3px;
    min-height: 17px;
  }
  .seat-cards { display: flex; gap: 3px; margin-top: 6px; }
  .badge {
    position: absolute; top: -7px; right: -7px; background: var(--warn); color: #0b1410;
    font-family: var(--mono); font-size: 9.5px; font-weight: 700; border-radius: 999px;
    padding: 1px 6px; letter-spacing: .04em;
  }

  .card {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 26px; height: 34px; padding: 0 4px; border-radius: 3px;
    background: #f2f4ef; color: #14181a; font-family: var(--mono);
    font-size: 14px; font-weight: 700; letter-spacing: -.02em;
  }
  .card.red { color: #b3303c; }
  .card.back {
    background: repeating-linear-gradient(45deg, #24382e 0 4px, #1b2b23 4px 8px);
    color: transparent; border: 1px solid var(--line);
  }
  .card.small { min-width: 21px; height: 28px; font-size: 12px; }

  .middle { text-align: center; padding: 18px 0 10px; }
  .board { display: flex; gap: 5px; justify-content: center; min-height: 34px; }
  .pot { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 10px; }
  .pot b { color: var(--ink); font-size: 15px; }
  .street-tag {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    letter-spacing: .1em; text-transform: uppercase;
  }

  /* ---------- 日志 ---------- */
  .log {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; max-height: 168px; overflow-y: auto; font-size: 12.5px;
    color: var(--muted); font-family: var(--mono);
  }
  .log div { padding: 1px 0; }
  .log .street { color: var(--accent); }

  /* ---------- 操作栏 ---------- */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(15, 21, 18, .96); border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    backdrop-filter: blur(8px);
  }
  .actionbar .inner { max-width: 860px; margin: 0 auto; }
  .buttons { display: flex; gap: 8px; }
  .buttons button {
    flex: 1; padding: 13px 6px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--surface-2); font-weight: 600; font-size: 14px; min-height: 48px;
  }
  .buttons button.fold:not(:disabled) { border-color: rgba(224,112,122,.5); color: var(--danger); }
  .buttons button.raise:not(:disabled) { background: var(--accent); color: #0b1410; border-color: var(--accent); }
  .buttons button:hover:not(:disabled) { filter: brightness(1.12); }
  .sizing { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sizing input[type=range] { flex: 1; accent-color: var(--accent); }
  .sizing .amount {
    font-family: var(--mono); font-size: 14px; min-width: 62px; text-align: right; color: var(--warn);
  }
  .quick { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .quick button {
    border: 1px solid var(--line); background: none; color: var(--muted);
    border-radius: 999px; padding: 4px 11px; font-size: 12px; font-family: var(--mono);
  }
  .quick button:hover { color: var(--ink); border-color: var(--accent); }
  .waiting { text-align: center; color: var(--muted); font-size: 13px; padding: 6px 0; }
  .result {
    text-align: center; font-size: 13.5px; padding: 4px 0 10px;
  }
  .result .win { color: var(--accent); font-weight: 600; }
  .result .lose { color: var(--danger); }
  .hidden { display: none !important; }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* ---- 复盘（FR-9）---- */
  .rv-step { padding: 10px 0; border-top: 1px solid var(--line); }
  .rv-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .rv-pos { font-family: var(--mono); font-size: 11px; color: var(--accent);
    letter-spacing: .06em; }
  .rv-act { font-size: 13.5px; font-weight: 600; }
  .rv-ctx { font-family: var(--mono); font-size: 11px; color: var(--muted);
    margin-left: auto; }
  .rv-verdict { font-size: 12.5px; margin-top: 4px; }
  .rv-verdict.bad { color: var(--warn); font-weight: 600; }
  .rv-verdict.good { color: var(--ok, #7bd88f); }
  /* 判不了的点要看得出来，别跟判得了的混成一片 */
  .rv-step.ungraded { opacity: .6; }
  .rv-note { margin-top: 10px; padding: 10px; border-radius: 8px;
    background: var(--surface-2); font-size: 12.5px; color: var(--muted); }
  .rv-scale { margin-top: 12px; font-size: 11.5px; color: var(--muted); }

  /* ---- 场景训练（FR-12）---- */
  .train-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .train-actions button { min-height: 44px; padding: 0 20px; }   /* 触屏目标 */
  .train-spot { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .train-spot[hidden], .train-spot.hidden { display: none; }
  .train-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .train-label { font-size: 14px; font-weight: 600; }
  .train-choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .train-choices button { min-height: 44px; padding: 0 16px; }
  .train-choices input { width: 90px; min-height: 44px; background: var(--surface-2);
    border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 0 10px;
    font-family: var(--mono); }
  .train-result { margin-top: 14px; padding: 12px; border-radius: 8px;
    background: var(--surface-2); }
  .train-result.hidden { display: none; }
  .train-verdict { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .train-verdict.good { color: var(--ok, #7bd88f); }
  .train-verdict.bad { color: var(--warn); }
  .train-bar { display: flex; align-items: center; gap: 8px; margin-top: 4px;
    font-family: var(--mono); font-size: 12px; }
  .train-bar .name { min-width: 92px; }
  .train-bar .track { flex: 1; height: 8px; background: var(--surface); border-radius: 4px;
    overflow: hidden; }
  .train-bar .fill { height: 100%; background: var(--accent); }
  .train-bar.taken .name { color: var(--warn); font-weight: 600; }

  /* ---- HUD（FR-8）---- */
  .seat-hud { display: flex; gap: 7px; margin-top: 5px; font-family: var(--mono);
    font-size: 10.5px; color: var(--muted); cursor: pointer; }
  .seat-hud .m { display: flex; gap: 2px; }
  .seat-hud .m b { font-weight: 600; color: var(--text); }
  /* 样本不足＝**数字本身不可信**，用颜色说出来，而不是照常显示一个精确的百分比 */
  .seat-hud .thin b { color: var(--muted); }
  .seat-hud .none b { color: var(--muted); }
  .hud-modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex;
    align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .hud-modal[hidden] { display: none; }   /* 作者样式会盖掉 hidden 属性，必须补这条 */
  .hud-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; width: min(420px, 100%); max-height: 80vh; overflow-y: auto; }
  .hud-card h3 { margin: 0 0 4px; font-size: 15px; }
  .hud-sample { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .hud-row { display: flex; align-items: baseline; gap: 8px; padding: 6px 0;
    border-top: 1px solid var(--line); }
  .hud-row .label { min-width: 74px; font-size: 12.5px; }
  .hud-row .value { font-family: var(--mono); font-size: 13px; font-weight: 600;
    min-width: 56px; text-align: right; }
  .hud-row .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .hud-row .hint { font-size: 11px; color: var(--muted); margin-left: auto; text-align: right; }
  .hud-row.thin .value { color: var(--muted); }
  .hud-close { margin-top: 12px; width: 100%; min-height: 44px; }  /* 触屏目标 ≥44px */
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>德扑训练台</h1>
    <span class="meta" id="handMeta"></span>
    <span class="spacer"></span>
    <button class="link-btn" id="reviewToggle">复盘</button>
    <button class="link-btn" id="trainToggle">场景训练</button>
    <button class="link-btn" id="setupToggle">牌桌设置</button>
  </header>

  <section class="panel hidden" id="review">
    <h2>复盘</h2>
    <div class="meta" id="reviewMeta"></div>
    <div id="reviewBody"></div>
  </section>

  <section class="panel hidden" id="training">
    <h2>场景训练</h2>
    <div class="fields">
      <div class="field">
        <label for="trainKind">场景</label>
        <select id="trainKind"></select>
      </div>
      <div class="field">
        <label for="trainHero">我的位置</label>
        <select id="trainHero"></select>
      </div>
      <div class="field" id="trainVillainField">
        <label for="trainVillain" id="trainVillainLabel">对手位置</label>
        <select id="trainVillain"></select>
      </div>
    </div>
    <div class="train-actions">
      <button id="trainDeal">发一题</button>
      <span class="meta" id="trainStreak"></span>
    </div>

    <div class="train-spot hidden" id="trainSpot">
      <div class="train-head">
        <span class="train-label" id="trainLabel"></span>
        <span class="meta" id="trainPot"></span>
      </div>
      <div class="seat-cards" id="trainCards"></div>
      <div class="train-choices" id="trainChoices"></div>
      <div class="train-result hidden" id="trainResult"></div>
    </div>
  </section>

  <section class="panel" id="setup">
    <h2>牌桌设置</h2>
    <div class="fields">
      <div class="field">
        <label for="seatCount">座位数</label>
        <select id="seatCount"></select>
      </div>
      <div class="field">
        <label for="startingStack">起始筹码</label>
        <input id="startingStack" type="number" value="1000" min="1" step="1">
      </div>
      <div class="field">
        <label for="smallBlind">小盲</label>
        <input id="smallBlind" type="number" value="5" min="0" step="1">
      </div>
      <div class="field">
        <label for="bigBlind">大盲</label>
        <input id="bigBlind" type="number" value="10" min="1" step="1">
      </div>
      <div class="field">
        <label for="ante">前注</label>
        <input id="ante" type="number" value="0" min="0" step="1">
      </div>
    </div>
    <div class="seat-styles" id="seatStyles"></div>
    <div style="margin-top:14px">
      <button class="primary" id="createTable">开桌</button>
    </div>
    <div class="error" id="setupError"></div>
  </section>

  <section class="felt hidden" id="table">
    <div class="seats" id="seats"></div>
    <div class="middle">
      <div class="street-tag" id="streetTag"></div>
      <div class="board" id="board"></div>
      <div class="pot" id="pot"></div>
    </div>
  </section>

  <div class="log hidden" id="log"></div>
</div>

<div class="actionbar hidden" id="actionbar">
  <div class="inner">
    <div class="result" id="result"></div>
    <div id="controls" class="hidden">
      <div class="quick" id="quick"></div>
      <div class="sizing" id="sizing">
        <input type="range" id="raiseRange" min="0" max="0" step="1">
        <span class="amount" id="raiseAmount">0</span>
      </div>
      <div class="buttons">
        <button class="fold" id="btnFold">弃牌</button>
        <button id="btnCheckCall">过牌</button>
        <button class="raise" id="btnRaise">加注</button>
      </div>
    </div>
    <div class="waiting hidden" id="waiting">对手行动中…</div>
    <div class="buttons hidden" id="nextWrap">
      <button class="raise" id="btnNext">下一手</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const SUITS = { s: "♠", h: "♥", d: "♦", c: "♣" };
let state = null;
let styles = [];
let socket = null;

// ---------------------------------------------------------------- 工具

function cardEl(text, small) {
  const el = document.createElement("span");
  el.className = "card" + (small ? " small" : "");
  if (!text) { el.classList.add("back"); el.textContent = "??"; return el; }
  const rank = text[0], suit = text[1];
  el.textContent = rank + SUITS[suit];
  if (suit === "h" || suit === "d") el.classList.add("red");
  return el;
}


// ---------------------------------------------------------------- HUD（FR-8）

let hud = null;

// 样本量门槛。**这两个数是拍的**，写在这儿而不是服务端，因为「够不够」取决于
// 看哪个指标：VPIP 几十手就稳，3bet 要几百手。服务端给原始计数、前端决定怎么显示，
// 这样想按指标细分门槛时不用改接口。
const HUD_THIN = 20;   // 少于这么多次机会：数字置灰，别让人当真
const HUD_NONE = 5;    // 少于这么多：直接显示「—」，一个百分比都不给

function hudCell(metric) {
  // rate 为 null＝**一次机会都没有过**，跟「有机会但 0%」是两件事，不能都画成 0%
  if (metric.rate === null || metric.chances < HUD_NONE) return { text: "—", cls: "none" };
  const text = Math.round(metric.rate * 100) + "%";
  return { text, cls: metric.chances < HUD_THIN ? "thin" : "" };
}

function seatHud(seat) {
  const row = document.createElement("div");
  row.className = "seat-hud";
  const line = hud && hud.seats ? hud.seats[seat.seat] : null;
  if (!line) return row;

  // 卡片上只放最常看的三项，其余进浮层——牌桌上的空间比信息更稀缺
  const wanted = ["vpip", "pfr", "threebet"];
  wanted.forEach((key) => {
    const metric = line.stats.find((m) => m.key === key);
    if (!metric) return;
    const cell = hudCell(metric);
    const box = document.createElement("span");
    box.className = "m " + cell.cls;
    box.innerHTML = metric.label + " <b>" + cell.text + "</b>";
    row.appendChild(box);
  });
  row.title = "点开看完整统计（" + line.hands + " 手）";
  row.addEventListener("click", (event) => { event.stopPropagation(); showHud(line); });
  return row;
}

function showHud(line) {
  const modal = $("hudModal");
  const card = $("hudCard");
  card.innerHTML = "";

  const title = document.createElement("h3");
  title.textContent = line.name;
  const sample = document.createElement("div");
  sample.className = "hud-sample";
  // **样本量摆在最显眼处**：HUD 最大的坑就是拿几手牌的数字当真
  sample.textContent = line.hands + " 手" + (line.hands < HUD_THIN ? "（样本还很少，数字仅供参考）" : "");
  card.append(title, sample);

  line.stats.forEach((metric) => {
    const row = document.createElement("div");
    row.className = "hud-row";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = metric.label;
    const value = document.createElement("span");
    value.className = "value";
    const n = document.createElement("span");
    n.className = "n";

    if (metric.key === "aggression_factor") {
      // AF 不是比率，别拿百分比逻辑套它（服务端给的是 value + 两个计数）
      value.textContent = metric.value === null ? "—" : metric.value.toFixed(2);
      n.textContent = metric.aggressive + "/" + metric.calls;
    } else {
      const cell = hudCell(metric);
      value.textContent = cell.text;
      if (cell.cls) row.classList.add("thin");
      n.textContent = metric.hits + "/" + metric.chances;
    }

    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = metric.hint;
    row.append(label, value, n, hint);
    card.appendChild(row);
  });

  const close = document.createElement("button");
  close.className = "hud-close";
  close.textContent = "关闭";
  close.addEventListener("click", hideHud);
  card.appendChild(close);
  modal.hidden = false;
}

function hideHud() { $("hudModal").hidden = true; }

async function refreshHud() {
  // 统计一手牌才变一次，所以**不跟着每次动作的广播走**，只在这里主动拉
  try { hud = await api("/api/hud"); render(); } catch (e) { /* 没建桌就没有 HUD */ }
}


// ---------------------------------------------------------------- 场景训练（FR-12）

let trainKinds = [];
let trainSpot = null;
let trainStreak = { done: 0, onSolution: 0 };

async function initTraining() {
  const body = await api("/api/training/scenarios");
  trainKinds = body.kinds;
  const kindSel = $("trainKind");
  kindSel.innerHTML = "";
  trainKinds.forEach((kind) => {
    const option = document.createElement("option");
    option.value = kind.id;
    option.textContent = kind.label;
    kindSel.appendChild(option);
  });
  ["trainHero", "trainVillain"].forEach((id) => {
    const sel = $(id);
    sel.innerHTML = "";
    body.positions.forEach((name) => {
      const option = document.createElement("option");
      option.value = option.textContent = name;
      sel.appendChild(option);
    });
  });
  $("trainHero").value = "UTG";
  $("trainVillain").value = "BTN";
  kindSel.addEventListener("change", syncVillainField);
  syncVillainField();
}

function syncVillainField() {
  const kind = trainKinds.find((k) => k.id === $("trainKind").value);
  const needs = kind && kind.needsVillain;
  $("trainVillainField").style.display = needs ? "" : "none";
  if (needs) $("trainVillainLabel").textContent = kind.villainLabel;
}

async function dealTraining() {
  const kind = trainKinds.find((k) => k.id === $("trainKind").value);
  const payload = { kind: $("trainKind").value, hero: $("trainHero").value };
  if (kind && kind.needsVillain) payload.villain = $("trainVillain").value;
  try {
    trainSpot = await api("/api/training/deal", {
      method: "POST", body: JSON.stringify(payload),
    });
  } catch (error) {
    $("trainResult").className = "train-result";
    $("trainResult").textContent = "发不出这道题：" + error.message;
    return;
  }
  renderTrainingSpot();
}

function renderTrainingSpot() {
  $("trainSpot").classList.remove("hidden");
  $("trainResult").classList.add("hidden");
  $("trainLabel").textContent = trainSpot.label;
  $("trainPot").textContent =
    `底池 ${trainSpot.pot} · 盲注 ${trainSpot.bigBlind / 2}/${trainSpot.bigBlind}`;

  const cards = $("trainCards");
  cards.innerHTML = "";
  trainSpot.hero.cards.forEach((text) => cards.appendChild(cardEl(text)));

  const choices = $("trainChoices");
  choices.innerHTML = "";
  const legal = trainSpot.legal;
  if (legal.canFold) choices.appendChild(trainButton("弃牌", { kind: "fold" }));
  if (legal.canCheck) choices.appendChild(trainButton("过牌", { kind: "check" }));
  if (legal.canCall) {
    choices.appendChild(trainButton(`跟注 ${legal.callCost}`, { kind: "call" }));
  }
  if (legal.canRaise) {
    // 加注额的上下界**用服务端给的**，不在前端推——那是引擎的判断，
    // 猜一份出来会让界面允许打不出来的动作
    const input = document.createElement("input");
    input.type = "number";
    input.id = "trainRaiseTo";
    input.min = legal.minRaiseTo;
    input.max = legal.maxRaiseTo;
    input.value = legal.minRaiseTo;
    choices.appendChild(input);
    choices.appendChild(trainButton("加注到", null, () => ({
      kind: "raise", to: Number($("trainRaiseTo").value),
    })));
  }
}

function trainButton(text, payload, build) {
  const button = document.createElement("button");
  button.textContent = text;
  button.addEventListener("click", () => answerTraining(build ? build() : payload));
  return button;
}

async function answerTraining(payload) {
  let result;
  try {
    result = await api("/api/training/answer", {
      method: "POST", body: JSON.stringify(payload),
    });
  } catch (error) {
    showTrainingResult({ error: error.message });
    return;
  }
  showTrainingResult(result);
}

function showTrainingResult(result) {
  const box = $("trainResult");
  box.className = "train-result";
  box.innerHTML = "";

  if (result.error) {
    box.textContent = result.error;
    return;
  }
  if (!result.graded) {
    // **说不了就说不了**：表里没这一格时如实说，不编一个分数
    box.textContent = result.why;
    return;
  }

  trainStreak.done += 1;
  if (result.onSolution) trainStreak.onSolution += 1;
  $("trainStreak").textContent =
    `本轮 ${trainStreak.done} 题，照解走 ${trainStreak.onSolution}`;

  const verdict = document.createElement("div");
  verdict.className = "train-verdict " + (result.blunder ? "bad" : result.onSolution ? "good" : "");
  verdict.textContent = result.verdict;
  box.appendChild(verdict);

  // 完整分布画成条：**判词只有三档，条形图才看得出差多少**
  const entries = Object.entries(result.weights).sort((a, b) => b[1] - a[1]);
  entries.forEach(([label, weight]) => {
    const row = document.createElement("div");
    row.className = "train-bar" + (label === result.taken ? " taken" : "");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = label;
    const track = document.createElement("span");
    track.className = "track";
    const fill = document.createElement("span");
    fill.className = "fill";
    fill.style.width = Math.round(weight * 100) + "%";
    track.appendChild(fill);
    const value = document.createElement("span");
    value.textContent = Math.round(weight * 100) + "%";
    row.append(name, track, value);
    box.appendChild(row);
  });

  const note = document.createElement("div");
  note.className = "meta";
  note.style.marginTop = "8px";
  // 这句不能省：翻前表里没有 EV，给的是频率分。不说清楚，用户会把它当 EV 损失读
  note.textContent = "这是解给各动作的频率，不是 EV 损失——翻前范围表里没有 EV。";
  box.appendChild(note);
}


// ---------------------------------------------------------------- 复盘（FR-9）

async function refreshReview() {
  const meta = $("reviewMeta");
  const body = $("reviewBody");
  body.innerHTML = "";
  let data;
  try {
    data = await api("/api/review");
  } catch (error) {
    meta.textContent = error.message;
    return;
  }

  const net = data.net > 0 ? `+${data.net}` : String(data.net);
  meta.textContent =
    `第 ${data.handNo} 手 · 你的牌 ${data.heroCards.join(" ")} · 净额 ${net}`;

  if (data.preflopNote) {
    body.appendChild(noteEl(data.preflopNote));
  }
  if (!data.preflop.length && !data.preflopNote) {
    body.appendChild(noteEl("这手牌你翻前没有做过决策（比如大盲直接过牌）。"));
  }

  data.preflop.forEach((step) => {
    const el = document.createElement("div");
    el.className = "rv-step" + (step.graded ? "" : " ungraded");

    const head = document.createElement("div");
    head.className = "rv-head";
    const pos = document.createElement("span");
    pos.className = "rv-pos";
    pos.textContent = `#${step.index} ${step.position}`;
    const act = document.createElement("span");
    act.className = "rv-act";
    act.textContent = step.action;
    const ctx = document.createElement("span");
    ctx.className = "rv-ctx";
    ctx.textContent = `底池 ${step.potBefore}` + (step.toCall ? ` · 待跟 ${step.toCall}` : "");
    head.append(pos, act, ctx);
    el.appendChild(head);

    const verdict = document.createElement("div");
    verdict.className = "rv-verdict" +
      (step.blunder ? " bad" : step.graded && step.frequency > 0.5 ? " good" : "");
    verdict.textContent = step.verdict;
    el.appendChild(verdict);

    // 判得了的点才画分布；判不了的只留那句话，别画一个空图
    if (step.graded) {
      Object.entries(step.weights)
        .sort((a, b) => b[1] - a[1])
        .forEach(([label, weight]) => {
          const row = document.createElement("div");
          row.className = "train-bar" + (label === step.taken ? " taken" : "");
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = label;
          const track = document.createElement("span");
          track.className = "track";
          const fill = document.createElement("span");
          fill.className = "fill";
          fill.style.width = Math.round(weight * 100) + "%";
          track.appendChild(fill);
          const value = document.createElement("span");
          value.textContent = Math.round(weight * 100) + "%";
          row.append(name, track, value);
          el.appendChild(row);
        });
    }
    body.appendChild(el);
  });

  // 翻后那半：没装求解器就把原话显示出来，**不留空**——
  // 空着会让人以为「翻后没问题」，而实际上是根本没算
  if (!data.postflop.available) {
    body.appendChild(noteEl(data.postflop.why));
  }

  const scale = document.createElement("div");
  scale.className = "rv-scale";
  // 两半的精度不同，必须说清楚：并排放着很容易被当成同一把尺子
  scale.textContent =
    "翻前给的是「解给各动作的频率」（范围表里没有 EV）；翻后的 EV 损失要真解局面，两者不是同一把尺子。";
  body.appendChild(scale);
}

function noteEl(text) {
  const el = document.createElement("div");
  el.className = "rv-note";
  el.textContent = text;
  return el;
}

async function api(path, options) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return response.json();
}

// ---------------------------------------------------------------- 设置

function buildSeatStyleRows() {
  const count = parseInt($("seatCount").value, 10);
  const container = $("seatStyles");
  container.innerHTML = "";
  for (let seat = 0; seat < count; seat++) {
    const row = document.createElement("label");
    row.className = "seat-style";
    const tag = document.createElement("span");
    tag.textContent = seat === 0 ? "你" : "座位 " + seat;
    row.appendChild(tag);
    if (seat === 0) {
      const fixed = document.createElement("select");
      fixed.disabled = true;
      fixed.innerHTML = "<option>真人</option>";
      row.appendChild(fixed);
    } else {
      const select = document.createElement("select");
      select.dataset.seat = String(seat);
      select.className = "style-pick";
      styles.forEach((style) => {
        const option = document.createElement("option");
        option.value = style.id;
        option.textContent = style.label;
        select.appendChild(option);
      });
      row.appendChild(select);
    }
    container.appendChild(row);
  }
}

async function createTable() {
  $("setupError").textContent = "";
  const count = parseInt($("seatCount").value, 10);
  const picks = {};
  document.querySelectorAll(".style-pick").forEach((el) => {
    picks[el.dataset.seat] = el.value;
  });
  const seats = [{ name: "你", isHuman: true, style: "tag" }];
  for (let seat = 1; seat < count; seat++) {
    seats.push({ name: "bot" + seat, isHuman: false, style: picks[seat] || "tag" });
  }
  try {
    await api("/api/table", {
      method: "POST",
      body: JSON.stringify({
        seats,
        startingStack: parseInt($("startingStack").value, 10),
        bigBlind: parseInt($("bigBlind").value, 10),
        smallBlind: parseInt($("smallBlind").value, 10),
        ante: parseInt($("ante").value, 10),
      }),
    });
    $("setup").classList.add("hidden");
    await api("/api/hand", { method: "POST" });
  } catch (error) {
    $("setupError").textContent = error.message;
  }
}

// ---------------------------------------------------------------- 渲染

function render() {
  if (!state) return;
  $("table").classList.remove("hidden");
  $("log").classList.remove("hidden");
  $("actionbar").classList.remove("hidden");
  $("handMeta").textContent =
    `第 ${state.handNo} 手 · 盲注 ${state.smallBlind}/${state.bigBlind}`;

  // 座位
  const seats = $("seats");
  seats.innerHTML = "";
  state.seats.forEach((seat) => {
    const el = document.createElement("div");
    el.className = "seat";
    if (seat.isActing) el.classList.add("acting");
    if (seat.folded) el.classList.add("folded");
    if (seat.seat === state.heroSeat) el.classList.add("hero");

    if (seat.seat === state.button) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "D";
      el.appendChild(badge);
    }

    const top = document.createElement("div");
    top.className = "seat-top";
    const name = document.createElement("span");
    name.className = "seat-name";
    name.textContent = seat.name;
    const pos = document.createElement("span");
    pos.className = "seat-pos";
    pos.textContent = seat.position;
    top.append(name, pos);
    if (seat.style) {
      const style = document.createElement("span");
      style.className = "seat-style-tag";
      style.textContent = seat.style;
      top.appendChild(style);
    }
    el.appendChild(top);

    const stack = document.createElement("div");
    stack.className = "seat-stack";
    stack.textContent = seat.stack + (seat.allIn ? " · 全下" : "");
    el.appendChild(stack);

    el.appendChild(seatHud(seat));

    const bet = document.createElement("div");
    bet.className = "seat-bet";
    bet.textContent = seat.committed > 0 ? "投入 " + seat.committed : "";
    el.appendChild(bet);

    const cards = document.createElement("div");
    cards.className = "seat-cards";
    if (seat.folded) {
      // 弃牌后不显示牌位
    } else if (seat.cards) {
      seat.cards.forEach((c) => cards.appendChild(cardEl(c, seat.seat !== state.heroSeat)));
    } else {
      cards.append(cardEl(null, true), cardEl(null, true));
    }
    el.appendChild(cards);
    seats.appendChild(el);
  });

  // 公共牌与底池
  const board = $("board");
  board.innerHTML = "";
  state.board.forEach((c) => board.appendChild(cardEl(c)));
  $("streetTag").textContent = state.street || "";
  $("pot").innerHTML = state.pot ? `底池 <b>${state.pot}</b>` : "";

  // 日志
  const log = $("log");
  log.innerHTML = "";
  state.log.forEach((line) => {
    const el = document.createElement("div");
    el.textContent = line.text;
    if (line.text.startsWith("发牌")) el.classList.add("street");
    log.appendChild(el);
  });
  log.scrollTop = log.scrollHeight;

  renderControls();
}

function renderControls() {
  const controls = $("controls");
  const waiting = $("waiting");
  const nextWrap = $("nextWrap");
  const result = $("result");

  if (state.result) {
    const net = state.result.net[state.heroSeat];
    const label = net > 0 ? `<span class="win">本手 +${net}</span>`
                : net < 0 ? `<span class="lose">本手 ${net}</span>`
                : "本手打平";
    result.innerHTML = label + (state.result.wentToShowdown ? " · 摊牌" : "");
    controls.classList.add("hidden");
    waiting.classList.add("hidden");
    nextWrap.classList.remove("hidden");
    return;
  }

  result.textContent = "";
  nextWrap.classList.add("hidden");

  if (!state.legal) {
    controls.classList.add("hidden");
    waiting.classList.toggle("hidden", !state.inProgress);
    return;
  }

  waiting.classList.add("hidden");
  controls.classList.remove("hidden");
  const legal = state.legal;

  $("btnFold").disabled = !legal.canFold;
  const checkCall = $("btnCheckCall");
  if (legal.canCheck) {
    checkCall.textContent = "过牌";
    checkCall.disabled = false;
    checkCall.dataset.kind = "check";
  } else if (legal.canCall) {
    checkCall.textContent = `跟注 ${legal.callCost}`;
    checkCall.disabled = false;
    checkCall.dataset.kind = "call";
  } else {
    checkCall.textContent = "过牌";
    checkCall.disabled = true;
  }

  const raiseBtn = $("btnRaise");
  const range = $("raiseRange");
  const sizing = $("sizing");
  const quick = $("quick");
  raiseBtn.disabled = !legal.canRaise;
  sizing.classList.toggle("hidden", !legal.canRaise);
  quick.classList.toggle("hidden", !legal.canRaise);

  if (legal.canRaise) {
    range.min = legal.minRaiseTo;
    range.max = legal.maxRaiseTo;
    const preferred = Math.min(legal.potSizedTo, legal.maxRaiseTo);
    range.value = Math.max(legal.minRaiseTo, preferred);
    updateRaiseLabel();

    quick.innerHTML = "";
    const options = [
      ["最小", legal.minRaiseTo],
      ["半池", Math.round((legal.minRaiseTo + legal.potSizedTo) / 2)],
      ["底池", legal.potSizedTo],
      ["全下", legal.maxRaiseTo],
    ];
    options.forEach(([label, value]) => {
      const clamped = Math.max(legal.minRaiseTo, Math.min(value, legal.maxRaiseTo));
      const button = document.createElement("button");
      button.textContent = label;
      button.onclick = () => { range.value = clamped; updateRaiseLabel(); };
      quick.appendChild(button);
    });
  }
}

function updateRaiseLabel() {
  const value = parseInt($("raiseRange").value, 10);
  $("raiseAmount").textContent = value;
  $("btnRaise").textContent =
    state.legal && state.legal.isOpeningBet ? "下注" : "加注";
}

// ---------------------------------------------------------------- 动作

async function send(kind, amount) {
  try {
    state = await api("/api/action", {
      method: "POST",
      body: JSON.stringify({ kind, amount: amount ?? null }),
    });
    render();
  } catch (error) {
    console.warn(error.message);
  }
}

async function nextHand() {
  try {
    state = await api("/api/hand", { method: "POST" });
    render();
    refreshHud();
  } catch (error) {
    console.warn(error.message);
  }
}

// ---------------------------------------------------------------- 连接

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  socket = new WebSocket(`${scheme}://${location.host}/ws`);
  socket.onmessage = (event) => {
    const previous = state;
    state = JSON.parse(event.data);
    render();
    // 统计只在**一手打完**之后才变，所以只在"刚刚结束"的那一刻拉一次，
    // 不跟着每条广播走（那会把一份基本不动的数据请求几十遍）
    if (previous && previous.inProgress && !state.inProgress) {
      refreshHud();
      // 复盘面板开着就跟着刷新——**刚打完那一刻正是想看的时候**
      if (!$("review").classList.contains("hidden")) refreshReview();
    }
  };
  socket.onclose = () => setTimeout(connect, 1500);
}

async function init() {
  const data = await api("/api/styles");
  styles = data.styles;

  const seatCount = $("seatCount");
  for (let n = 2; n <= 9; n++) {
    const option = document.createElement("option");
    option.value = String(n);
    option.textContent = n + " 人";
    if (n === 6) option.selected = true;
    seatCount.appendChild(option);
  }
  seatCount.onchange = buildSeatStyleRows;
  buildSeatStyleRows();

  $("createTable").onclick = createTable;
  $("setupToggle").onclick = () => $("setup").classList.toggle("hidden");
  // 场景训练**不需要牌桌**（它是独立的翻前练习），所以监听挂在这里而不是
  // `connect()` 里——挂在那儿的话，一进页面还没建桌时点它没反应。
  $("trainToggle").onclick = () => {
    const panel = $("training");
    panel.classList.toggle("hidden");
    if (!panel.classList.contains("hidden") && !trainKinds.length) initTraining();
  };
  $("trainDeal").onclick = dealTraining;
  $("reviewToggle").onclick = () => {
    const panel = $("review");
    panel.classList.toggle("hidden");
    if (!panel.classList.contains("hidden")) refreshReview();
  };
  $("btnFold").onclick = () => send("fold");
  $("btnCheckCall").onclick = (e) => send(e.currentTarget.dataset.kind);
  $("btnRaise").onclick = () => {
    const value = parseInt($("raiseRange").value, 10);
    send(state.legal.isOpeningBet ? "bet" : "raise", value);
  };
  $("raiseRange").oninput = updateRaiseLabel;
  $("btnNext").onclick = nextHand;

  connect();
  try {
    state = await api("/api/state");
    refreshHud();
    $("setup").classList.add("hidden");
    render();
  } catch (error) {
    // 还没开桌，留在设置面板
  }
}

init();
</script>
<div class="hud-modal" id="hudModal" hidden>
  <div class="hud-card" id="hudCard"></div>
</div>
</body>
</html>
